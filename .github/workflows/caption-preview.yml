name: Windows caption preview

on:
  push:
    branches: [ci/caption-buttons-preview]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # Screenshot-only app: sample data by default and no optional audio
      # visualizers. The title bar is the exact Fastframe PR 61 revision.
      - name: Build Windows preview
        run: mbx build --locked --no-default-features --features demo --bin spotifast
      - name: Check preview entrypoint
        run: mbx test --locked --no-default-features --features demo --bin spotifast
      - name: Package portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath target/debug/spotifast.exe -Destination dist/Spotifast-caption-preview.exe
          Copy-Item -LiteralPath packaging/spotifast-portable.txt -Destination dist/spotifast-portable.txt
          @"
          Double-click Spotifast-caption-preview.exe.
          This screenshot preview opens with invented demo data and an isolated temporary profile.
          It uses Fastframe PR 61 at fa1d63b546eaecf60c17e7716a42b739c4e7cc0a.
          Spotifast base: b99170f234fe3e2e7f6473ff549d4dd3ed45d4c7.
          MilkDrop and native Soloist audio are omitted from this screenshot build.
          "@ | Set-Content -LiteralPath dist/README.txt
          Get-FileHash -LiteralPath dist/Spotifast-caption-preview.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: Spotifast-caption-preview-Windows-x64
          path: dist/*
          retention-days: 7
          if-no-files-found: error
