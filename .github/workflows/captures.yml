name: captures
on:
  push:
    branches: [ci/captures]
jobs:
  shots:
    name: shots (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            ref: 52863632b246988e5f17c34dd1eb5001e8c1c8bf
          - name: after
            ref: 48edb88049bbf509a5d5004b158a921bafb368fe
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev xvfb libgl1-mesa-dri fonts-noto-cjk \
            libegl1 libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 ffmpeg xdotool fonts-noto-color-emoji
      - name: Toolchain
        working-directory: app
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: captures-${{ matrix.name }}
      - name: Bright covers
        run: python3 tools/.github/capture/patch_covers.py app/src/demo.rs
      - name: No art switch
        run: python3 tools/.github/capture/patch_no_art.py app/src/ui/lyrics.rs
      - name: Build
        working-directory: app
        run: cargo build --locked --features demo
      - name: Shoot
        run: bash tools/.github/capture/shoot-backdrop.sh "$PWD/app/target/debug/spotifast" shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.name }}
          path: shots
