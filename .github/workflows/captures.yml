name: captures
on:
  push:
    branches: [ci/captures]
jobs:
  shots:
    name: shots (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: before
            ref: eaaf3c6c12be1f97bc0043a3686d9b407df216f8
          - name: queue
            ref: 3a107092de242784d755fa2f134304bc92ff7f9c
          - name: save-playlist
            ref: 486f9fe59ad545edc1bd7ba4348dc7cb5f154101
          - name: bar
            ref: 71c3a90fb61f94f66b9e7347508e7e5f28f07c42
          - name: lyrics
            ref: 8be55cb135635f6d0041e6889e0ecb0879b828b6
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: app
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev xvfb libgl1-mesa-dri fonts-noto-cjk \
            libegl1 libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 ffmpeg xdotool fonts-noto-color-emoji
      - name: Toolchain
        working-directory: app
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: captures-${{ matrix.name == 'before' && 'before' || 'after' }}
      - name: Bright covers
        run: python3 tools/.github/capture/patch_covers.py app/src/demo.rs || echo "bright covers skipped"
      - name: Build
        working-directory: app
        run: cargo build --locked --features demo
      - name: Shoot
        run: bash tools/.github/capture/shoot-round30.sh "$PWD/app/target/debug/spotifast" shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.name }}
          path: shots
