name: fastframe-check
on:
  push:
    branches: [ci/fastframe-caption]
jobs:
  check:
    name: titlebar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Espaye/fastframe
          ref: caption-rebase
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev clang libclang-dev
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked -p fastframe-titlebar --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked -p fastframe-titlebar --all-targets
      - name: Doc tests
        run: cargo test --locked -p fastframe-titlebar --doc
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p fastframe-titlebar --no-deps
