name: Try build (Windows x64)

# Fork-only Windows test build for the owner. Never part of an upstream pull
# request. Every round force-pushes ci/try as: upstream main, the product
# change, then this file. A fork ruleset protects ci/try, so a successful run
# saves its compiled target and the next run recompiles only what changed.
on:
  push:
    branches: ["ci/try"]

permissions:
  contents: read

concurrency:
  group: try
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # The owner's PC has no Rust: rustfmt's changes come back as a patch.
      - name: Format
        continue-on-error: true
        shell: pwsh
        run: |
          cargo fmt --all
          New-Item -ItemType Directory -Force fmt | Out-Null
          git diff --output=fmt/fmt.patch
      - uses: actions/upload-artifact@v7
        with:
          name: fmt-patch
          path: fmt/
          if-no-files-found: ignore
      - run: vcpkg install glew:x64-windows-static
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Identify the MSVC toolset for the native build cache
        id: toolset
        shell: pwsh
        run: |
          if (-not $env:VCToolsVersion) { throw "MSVC toolset version is missing" }
          "version=$($env:VCToolsVersion.Trim())" >> $env:GITHUB_OUTPUT
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: try-v1-msvc-${{ steps.toolset.outputs.version }}
          save-on-protected-branch: true
      - name: Portable test build
        run: mbx build --locked --release --features demo
      - name: Portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/spotifast.exe, packaging/spotifast-portable.txt dist/
      - uses: actions/upload-artifact@v7
        with:
          name: spotifast-try-windows-x64
          path: dist/
          if-no-files-found: error

  # Round 30: the upstream merge, the ported review fixes and the shuffle
  # fix were written without compiling, so this job compiles and runs every
  # test (the Windows job builds only the exe).
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev             libwayland-dev libgl1-mesa-dev cmake libclang-dev
      - run: cargo fmt --all
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: try-linux-v1
          save-on-protected-branch: true
      - name: Clippy (all features)
        continue-on-error: true
        run: mbx clippy --all-targets --all-features -- -D warnings
      - name: Tests (all features)
        run: mbx test --all-targets --all-features --no-fail-fast
